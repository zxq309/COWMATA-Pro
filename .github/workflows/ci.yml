name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Use Qt's Linux xcb platform on a virtual display for the complete GUI
      # suite: https://pytest-qt.readthedocs.io/en/latest/troubleshooting.html
      - name: Install Linux Qt display libraries
        if: runner.os == 'Linux'
        # Qt needs Ubuntu's libegl1; unrelated runner Chrome repositories can
        # be temporarily inconsistent during upstream publication.
        run: |
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y gdb xvfb xauth libgl1 libegl1 libdbus-1-3 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils ffmpeg

      - name: Install Windows FFmpeg and NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg nsis --yes --no-progress --limit-output
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'NSIS compiler is missing' }
          "COWMATA_NSIS_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Use the same pytest release as the verified local acceptance run.
          # pytest 9.1.1 on Windows/Python 3.12 aborts during Qt teardown.
          pip install "pytest==8.3.5"

      - name: Lint
        run: ruff check cowmata_tailring tests

      - name: Test Linux with Qt xcb
        if: runner.os == 'Linux' && matrix.python-version != '3.10'
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1920x1200x24" pytest -v -o faulthandler_timeout=30

      - name: Test Linux 3.10 with native crash trace
        if: runner.os == 'Linux' && matrix.python-version == '3.10'
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1920x1200x24" gdb --batch --return-child-result -ex "set pagination off" -ex "set print thread-events off" -ex run -ex "thread apply all bt 35" --args python -m pytest -v -o faulthandler_timeout=30

      - name: Test Windows
        if: runner.os == 'Windows'
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        # Capture Python output without redirecting native Qt file descriptors.
        # Native Qt diagnostics remain visible in the Actions log.
        run: pytest -v --capture=sys -o faulthandler_timeout=30
