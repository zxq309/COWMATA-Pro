[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cowmata-tailring-annotator"
dynamic = ["version"]
description = "Video and nine-axis IMU annotation workstation for cattle behaviour"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zxq309" }]
keywords = ["annotation", "imu", "cattle", "behaviour", "video", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26,<3",
    "scipy>=1.12",
    "pandas>=2.2,<4",
    "scikit-learn>=1.4",
    "xgboost==3.4.1",
    "joblib>=1.4,<2",
    "Pillow>=10",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3.9,<4", "onnxruntime>=1.20"]
# Optional legacy research training dependencies. Learned models are external.
model = [
    "torch>=2.3",
    "pytorch-tcn>=1.2,<2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/zxq309/COWMATA-Pro"
Documentation = "https://github.com/zxq309/COWMATA-Pro#readme"
Repository = "https://github.com/zxq309/COWMATA-Pro"
Issues = "https://github.com/zxq309/COWMATA-Pro/issues"
Algorithm = "https://github.com/zxq309/COWMATA-Pro/blob/main/docs/project/repository-consolidation.md"

[project.scripts]
cowmata-annotator = "cowmata_tailring.app.main:main"

[tool.setuptools.dynamic]
version = { attr = "cowmata_tailring.__version__" }

[tool.setuptools.packages.find]
include = ["cowmata_tailring*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # UI text and translation catalogue intentionally keep readable strings intact.
    "B023",  # Flagged closures are consumed synchronously within their current loop iteration.
    "B905",  # The codebase supports Python 3.10; explicit zip(strict=) is not required here.
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"cowmata_tailring.edge_download" = ["certificates/*.pem", "ledger_known_hosts"]
